[project]
name = "ccsession"
version = "0.2.0"
description = "Reads this machine's Claude Code sessions: live status, transcripts and the desktop index"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur Carroll" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Tests only: validates schema/session.v1.json and its fixtures. The package stays stdlib-only.
dev = ["jsonschema>=4.18"]

[project.scripts]
ccsession = "ccsession.reader:main"
ccsessiond = "ccsession.daemon:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
